name: Release Python

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (for example, 1.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-python
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Match branch and package version
        working-directory: python
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          ref = os.environ["GITHUB_REF"]
          if ref != "refs/heads/release":
              raise SystemExit(
                  f"release workflow must run from the 'release' branch, got {ref!r}"
              )

          with open("pyproject.toml", "rb") as file:
              package_version = tomllib.load(file)["project"]["version"]

          requested_version = os.environ["RELEASE_VERSION"]
          if requested_version != package_version:
              raise SystemExit(
                  f"requested version {requested_version!r} does not match "
                  f"package version {package_version!r}"
              )
          PY

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build and inspect source distribution
        working-directory: python
        run: |
          python -m build --sdist --outdir dist .
          python -m twine check dist/*
      - name: Install and smoke test source distribution
        run: |
          cp python/smoke_test.py "${RUNNER_TEMP}/protocache-smoke.py"
          python -m pip install --force-reinstall python/dist/*.tar.gz
          cd "${RUNNER_TEMP}"
          python protocache-smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: protocache-sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  wheels:
    name: Wheels (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@v3.4.1
        with:
          package-dir: python
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: protocache-wheels-${{ runner.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/protocache
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: protocache-*
          path: dist
          merge-multiple: true
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
